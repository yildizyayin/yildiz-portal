name: Apply Answer Keys Calendar Layout

on:
  push:
    branches: [answerkeys-calendar-layout-final-2026-08-20]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: answerkeys-calendar-layout-final-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply requested UI changes only
        run: python scripts/apply_answerkeys_calendar_layout.py
      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Fix answer key hierarchy and add three calendar print layouts"
          git push origin HEAD:answerkeys-calendar-layout-final-2026-08-20
