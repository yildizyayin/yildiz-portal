name: Apply Bulk 2000 Difficulty

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bulk-import-2000-difficulty-final-2026-08-19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_bulk_2000_difficulty.py
      - name: Commit bulk import patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx src/index-final.ts
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Support 2000-row imports and difficulty levels"
          git push origin HEAD:bulk-import-2000-difficulty-final-2026-08-19
