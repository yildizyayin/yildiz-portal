name: Apply Control Center Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-orders-permissions-reminders-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_control_center_final.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx src/index-final.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Finish catalog filters order entry permissions tasks and reminders"
          git push origin HEAD:catalog-orders-permissions-reminders-2026-08-21
