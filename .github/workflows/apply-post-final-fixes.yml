name: Apply Post Final Fixes

on:
  push:
    branches: [final-fixes-2026-08-19]
    paths: [.apply-post-final-fixes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-fixes-2026-08-19
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python scripts/post-final-fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final operational edge cases"
          git push origin HEAD:final-fixes-2026-08-19
