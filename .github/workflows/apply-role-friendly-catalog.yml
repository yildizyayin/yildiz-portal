name: Apply Role Friendly Catalog

on:
  push:
    branches: [role-friendly-catalog-2026-08-21]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: role-friendly-catalog-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_role_friendly_catalog.py
      - name: Commit application patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Make deneme catalog consistent across roles"
          git push origin HEAD:role-friendly-catalog-2026-08-21
