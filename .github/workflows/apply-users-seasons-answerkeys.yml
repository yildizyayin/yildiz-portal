name: Apply Final Users Seasons Answer Keys

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-users-seasons-answerkeys-2026-08-19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_users_seasons_answerkeys.py
      - name: Commit application patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx src/index-final.ts
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Finish protected users seasons and answer key library"
          git push origin HEAD:final-users-seasons-answerkeys-2026-08-19
