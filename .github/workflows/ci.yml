name: Validate Deneme Platformu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Generate Cloudflare types and type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Verify scope lock
        shell: bash
        run: |
          # Optical form/document files are allowed as a download library.
          # Measurement, camera reading, scoring and academic analysis remain out of scope.
          if grep -RniE "(öğrenci karnesi|kazanım analizi|soru analizi|net hesaplama|puan hesaplama|branş deneme|optik okuma|optik.*kamera|kamera.*optik)" src/App.tsx src/index.ts src/AppFinal.tsx src/index-final.ts; then
            echo "Forbidden measurement/evaluation scope detected"
            exit 1
          fi