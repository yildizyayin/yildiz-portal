name: Cleanup Institution Portal Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: institution-portal-final-2026-08-19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cleanup_institution_duplicates.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx
          if git diff --cached --quiet; then
            echo "No duplicate cleanup needed"
            exit 0
          fi
          git commit -m "Fix duplicated institution portal definitions"
          git push origin HEAD:institution-portal-final-2026-08-19
