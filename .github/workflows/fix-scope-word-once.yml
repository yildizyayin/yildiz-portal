name: Fix Digital Format Scope Wording Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-users-seasons-answerkeys-2026-08-19
      - name: Remove measurement terminology from digital format label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppFinal.tsx')
          s=p.read_text().replace('Örn. Optik okuyucu XYZ / CSV','Örn. Dijital okuyucu XYZ / CSV')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppFinal.tsx
          git commit -m "Keep digital format wording outside measurement scope" || exit 0
          git push origin HEAD:final-users-seasons-answerkeys-2026-08-19
