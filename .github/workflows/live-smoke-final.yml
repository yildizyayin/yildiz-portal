name: Live Final Production Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Cloudflare production deploy
        run: sleep 50
      - name: Check final backend and D1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yildiz-deneme-platformu.rtsgida.workers.dev"
          STATUS=$(curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$BASE/api/setup/status")
          echo "$STATUS"
          echo "$STATUS" | grep -q '"ready":true'
          echo "$STATUS" | grep -q '"version":"final-2026-08-19"'
      - name: Check public frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yildiz-deneme-platformu.rtsgida.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 "$BASE/" > /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/home.html
          test $(wc -c < /tmp/home.html) -gt 200
