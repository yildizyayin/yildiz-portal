name: Reconstruct final application

on:
  push:
    branches: [deneme-final-2026-08-19]
    paths: [.reconstruct.ready]

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: deneme-final-2026-08-19

      - name: Restore final source files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib

          mapping = {
            '.reconstruct/App.tsx.gz.b64': ('src/App.tsx', '7bd0d1e65bf90b68aa8d2e6f9733fd3bbd27c113f4f9f21a6db107fc7187442c'),
            '.reconstruct/index.ts.gz.b64': ('src/index.ts', 'd6e68a9ee163f62a55ac607b7a97fca2e50cffd5e916f46c984be6b19892494c'),
            '.reconstruct/globals.css.gz.b64': ('src/styles/globals.css', '52c0323fb4ff1c85ce322f9dd4a254a84da60583afb65b77852e19806133ba4b'),
          }

          for source, (destination, expected) in mapping.items():
              encoded = pathlib.Path(source).read_text(encoding='utf-8').strip()
              decoded = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(decoded).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Checksum mismatch for {source}: {actual} != {expected}')
              target = pathlib.Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(decoded)
              print(f'Restored {destination} ({len(decoded)} bytes)')
          PY

      - name: Commit reconstructed application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .reconstruct
          rm -f .reconstruct.ready
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Application: restore final production sources"
            git push origin HEAD:deneme-final-2026-08-19
          fi
