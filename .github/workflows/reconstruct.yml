name: Reconstruct final application

on:
  push:
    branches: [deneme-final-2026-08-19]
    paths: [.reconstruct.ready]

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: deneme-final-2026-08-19

      - name: Restore final source files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib

          mapping = {
            '.reconstruct/App.tsx.gz.b64': ('src/App.tsx', 'dd3883256269e0967b65f7fa4b906b12b74dd76c6f46190d12e04f93be6678b6'),
            '.reconstruct/index.ts.gz.b64': ('src/index.ts', '1d96a11e235c8e130e8cb55359716dba60ee3f14a1ab49d4377adde1ab68a22e'),
            '.reconstruct/globals.css.gz.b64': ('src/styles/globals.css', '2f991a9c5efe6d993f2cff38d71f41fb66039a6648c6b3d9a2acb114d413c425'),
          }

          for source, (destination, expected) in mapping.items():
              encoded = pathlib.Path(source).read_text(encoding='utf-8').strip()
              decoded = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(decoded).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Checksum mismatch for {source}: {actual} != {expected}')
              target = pathlib.Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(decoded)
              print(f'Restored {destination} ({len(decoded)} bytes)')
          PY

      - name: Commit reconstructed application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .reconstruct
          rm -f .reconstruct.ready
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Application: restore final production sources"
            git push origin HEAD:deneme-final-2026-08-19
          fi
