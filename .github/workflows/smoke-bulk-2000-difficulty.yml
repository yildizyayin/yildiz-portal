name: Smoke Bulk 2000 Difficulty

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live worker and wait for deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yildiz-deneme-platformu.rtsgida.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 -H 'Cache-Control: no-cache' "$BASE/api/health?cb=${GITHUB_RUN_ID}")"
          echo "$HEALTH" | grep -q '"ok":true'
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            HTML="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$BASE/?cb=${GITHUB_RUN_ID}-${attempt}")"
            ASSET="$(printf '%s' "$HTML" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2)"
            if [ -n "$ASSET" ]; then
              curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$BASE$ASSET?cb=${GITHUB_RUN_ID}-${attempt}" -o /tmp/app.js
              a=$(grep -c '2.000 satır' /tmp/app.js || true)
              b=$(grep -c 'difficulty_level' /tmp/app.js || true)
              c=$(grep -c 'mevcut kayıt güncellenir' /tmp/app.js || true)
              d=$(grep -c 'Zorluk seviyesi' /tmp/app.js || true)
              echo "attempt=$attempt asset=$ASSET tokens=$a/$b/$c/$d"
              if [ "$a" -gt 0 ] && [ "$b" -gt 0 ] && [ "$c" -gt 0 ] && [ "$d" -gt 0 ]; then ok=1; break; fi
            fi
            sleep 20
          done
          test "$ok" = "1"
      - name: Verify bulk endpoint is protected
        shell: bash
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"season_id":"x","rows":[]}' 'https://yildiz-deneme-platformu.rtsgida.workers.dev/api/exams/bulk?cb=smoke')"
          test "$code" = "401"
