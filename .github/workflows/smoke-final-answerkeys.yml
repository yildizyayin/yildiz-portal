name: Smoke Final Answer Keys

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 65
      - name: Check live worker and deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yildiz-deneme-platformu.rtsgida.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 "$BASE/api/health")"
          echo "$HEALTH" | grep -q '"ok":true'
          HTML="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 "$BASE/")"
          ASSET="$(printf '%s' "$HTML" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          test -n "$ASSET"
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "$BASE$ASSET" -o /tmp/app.js
          grep -q 'Cevap Anahtarları ve Dijital Okuma Formatları' /tmp/app.js
          grep -q 'Dokunulmaz' /tmp/app.js
          grep -q 'Yeni Sezon Ekle' /tmp/app.js
          grep -q 'Sekonic' /tmp/app.js
          grep -q 'Bicom' /tmp/app.js
